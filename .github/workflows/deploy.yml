name: Deploy to VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Ganti path ini sesuai dengan lokasi folder bot di VPS kamu
            cd /path/to/your/wintermute-bot
            
            echo "Pulling latest changes from GitHub..."
            git pull origin master
            
            echo "Installing/Updating dependencies..."
            # Asumsi kamu pakai virtual environment (sangat disarankan)
            # Jika tidak, hapus baris 'source' di bawah
            source venv/bin/activate 2>/dev/null || true
            pip install -r requirements.txt
            
            echo "Restarting Bot Service..."
            # Ganti nama service sesuai dengan nama service systemd kamu, contoh:
            sudo systemctl restart wintermute-bot
            
            echo "Deployment Successful!"
